<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spice & Soul | Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #ff5a1f;
            --orange-dark: #e84610;
            --cream: #fff8f2;
            --white: #ffffff;
            --dark: #171717;
            --text: #292929;
            --muted: #777;
            --border: #eeeeee;
            --green: #14863b;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--cream);
            color: var(--text);
        }

        /* NAVBAR */

        header {
            height: 75px;
            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(255,255,255,.92);

            position: sticky;
            top: 0;
            z-index: 100;

            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .logo {
            color: var(--dark);
            text-decoration: none;

            font-size: 24px;
            font-weight: 900;
        }

        .logo span {
            color: var(--orange);
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
        }

        nav a:hover,
        nav a.active {
            color: var(--orange);
        }

        .cart-btn {
            border: none;
            background: var(--dark);
            color: white;

            padding: 11px 17px;

            border-radius: 30px;

            cursor: pointer;
            font-size: 15px;
        }

        .cart-btn span {
            background: var(--orange);
            padding: 3px 7px;
            border-radius: 50%;
            margin-left: 4px;
        }


        /* HERO */

        .hero {
            min-height: 430px;
            padding: 70px 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 85% 50%,
                    #ffd0b8,
                    transparent 28%
                ),
                var(--cream);
        }

        .hero-content {
            max-width: 650px;
        }

        .small-title {
            color: var(--orange);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .hero h1 {
            font-family: Georgia, serif;
            font-size: clamp(48px, 6vw, 80px);
            line-height: .95;
            margin: 20px 0;
        }

        .hero h1 span {
            color: var(--orange);
        }

        .hero p {
            color: var(--muted);
            font-size: 18px;
            line-height: 1.7;
        }

        .food-circle {
            width: 330px;
            height: 330px;

            background: var(--orange);

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 90px;

            box-shadow:
                0 30px 80px rgba(255,90,31,.3);

            animation: rotateFood 8s linear infinite;
        }

        @keyframes rotateFood {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }


        /* MENU */

        .menu {
            padding: 60px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title span {
            color: var(--orange);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .section-title h2 {
            font-family: Georgia, serif;
            font-size: 45px;
            margin-top: 8px;
        }


        /* SEARCH */

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 20px;

            margin-bottom: 25px;
        }

        .search {
            flex: 1;

            max-width: 600px;

            background: white;

            border: 1px solid var(--border);

            border-radius: 50px;

            padding: 14px 20px;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search input {
            width: 100%;

            border: none;
            outline: none;

            font-size: 16px;

            background: transparent;
        }

        select {
            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 0 18px;

            background: white;

            outline: none;
        }


        /* CATEGORY */

        .categories {
            display: flex;
            gap: 10px;

            overflow-x: auto;

            padding-bottom: 10px;

            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category {
            white-space: nowrap;

            border: 1px solid var(--border);

            background: white;

            padding: 12px 20px;

            border-radius: 50px;

            cursor: pointer;

            transition: .25s;
        }

        .category:hover,
        .category.active {
            background: var(--orange);
            color: white;
            border-color: var(--orange);
        }


        /* FOOD GRID */

        .food-grid {
            margin-top: 35px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 25px;
        }

        .card {
            background: white;

            border-radius: 20px;

            overflow: hidden;

            border: 1px solid var(--border);

            transition: .3s;
        }

        .card:hover {
            transform: translateY(-8px);

            box-shadow:
                0 25px 50px rgba(0,0,0,.1);
        }

        .card-img {
            height: 230px;

            position: relative;

            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: .5s;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        .badge {
            position: absolute;

            left: 15px;
            top: 15px;

            background: var(--orange);

            color: white;

            padding: 7px 12px;

            border-radius: 30px;

            font-size: 11px;
            font-weight: bold;
        }

        .heart {
            position: absolute;

            right: 15px;
            top: 15px;

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 50%;

            background: white;

            cursor: pointer;

            font-size: 19px;
        }

        .heart.liked {
            color: red;
        }

        .card-content {
            padding: 20px;
        }

        .card-top {
            display: flex;

            justify-content: space-between;

            gap: 10px;
        }

        .card h3 {
            font-size: 20px;
        }

        .rating {
            background: #fff2df;

            color: #b86600;

            padding: 5px 8px;

            border-radius: 7px;

            font-size: 12px;

            white-space: nowrap;
        }

        .description {
            color: var(--muted);

            font-size: 14px;

            line-height: 1.5;

            margin: 10px 0 18px;
        }

        .card-bottom {
            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .price {
            color: var(--orange);

            font-size: 21px;

            font-weight: bold;
        }

        .add {
            border: none;

            background: var(--dark);

            color: white;

            padding: 10px 16px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            transition: .2s;
        }

        .add:hover {
            background: var(--orange);
        }


        /* CART */

        .overlay {
            position: fixed;

            inset: 0;

            background: rgba(0,0,0,.45);

            opacity: 0;
            visibility: hidden;

            transition: .3s;

            z-index: 200;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .cart {
            position: fixed;

            top: 0;
            right: -450px;

            width: min(430px, 100%);

            height: 100vh;

            background: white;

            z-index: 300;

            padding: 25px;

            display: flex;
            flex-direction: column;

            transition: .35s;
        }

        .cart.open {
            right: 0;
        }

        .cart-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid var(--border);

            padding-bottom: 18px;
        }

        .cart-header button {
            border: none;

            background: none;

            font-size: 22px;

            cursor: pointer;
        }

        .cart-items {
            flex: 1;

            overflow-y: auto;

            padding: 15px 0;
        }

        .cart-item {
            display: flex;

            gap: 12px;

            padding: 15px 0;

            border-bottom: 1px solid var(--border);
        }

        .cart-item img {
            width: 70px;
            height: 70px;

            object-fit: cover;

            border-radius: 10px;
        }

        .cart-info {
            flex: 1;
        }

        .cart-info h4 {
            margin-bottom: 6px;
        }

        .cart-price {
            color: var(--orange);
            font-weight: bold;
        }

        .quantity {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
        }

        .quantity button {
            width: 25px;
            height: 25px;

            border: 1px solid #ddd;

            background: #fff8f2;

            border-radius: 5px;

            cursor: pointer;
        }

        .remove {
            border: none;
            background: none;
            color: red;
            cursor: pointer;
        }

        .cart-footer {
            border-top: 1px solid var(--border);

            padding-top: 20px;
        }

        .bill {
            display: flex;

            justify-content: space-between;

            margin: 10px 0;
        }

        .total {
            font-size: 22px;
            font-weight: bold;

            padding-top: 12px;

            border-top: 1px dashed #ddd;
        }

        .checkout {
            width: 100%;

            margin-top: 15px;

            padding: 16px;

            border: none;

            background: var(--orange);

            color: white;

            border-radius: 12px;

            font-weight: bold;

            cursor: pointer;

            font-size: 16px;
        }


        /* TOAST */

        .toast {
            position: fixed;

            bottom: 25px;
            left: 50%;

            transform:
                translate(-50%, 100px);

            background: var(--dark);

            color: white;

            padding: 14px 22px;

            border-radius: 50px;

            z-index: 500;

            opacity: 0;

            transition: .3s;
        }

        .toast.show {
            transform:
                translate(-50%, 0);

            opacity: 1;
        }


        /* MOBILE */

        @media(max-width: 900px) {

            nav {
                display: none;
            }

            .food-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .food-circle {
                width: 250px;
                height: 250px;

                font-size: 70px;
            }
        }

        @media(max-width: 650px) {

            header {
                padding: 0 5%;
            }

            .hero {
                padding: 60px 5%;

                flex-direction: column;

                text-align: center;

                gap: 50px;
            }

            .food-circle {
                width: 220px;
                height: 220px;

                font-size: 60px;
            }

            .menu {
                padding: 50px 5%;
            }

            .controls {
                flex-direction: column;
            }

            select {
                height: 48px;
            }

            .food-grid {
                grid-template-columns: 1fr;
            }

            .section-title h2 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <header>

        <a href="#" class="logo">
            Spice<span>&</span>Soul
        </a>

        <nav>
            <a href="#" class="active">Home</a>
            <a href="#menu">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <button class="cart-btn" onclick="openCart()">
            🛒 Cart
            <span id="cartCount">0</span>
        </button>

    </header>


    <!-- HERO -->

    <section class="hero">

        <div class="hero-content">

            <span class="small-title">
                ✦ OUR SPECIAL MENU
            </span>

            <h1>
                Good food.
                <br>
                <span>Good mood.</span>
            </h1>

            <p>
                Delicious food, beautiful moments and
                unforgettable flavours — all served
                fresh from our kitchen.
            </p>

        </div>

        <div class="food-circle">
            🍕
        </div>

    </section>


    <!-- MENU -->

    <section class="menu" id="menu">

        <div class="section-title">

            <span>DISCOVER OUR MENU</span>

            <h2>
                What are you craving?
            </h2>

        </div>


        <!-- SEARCH -->

        <div class="controls">

            <div class="search">

                🔍

                <input
                    type="text"
                    id="search"
                    placeholder="Search your favourite dish..."
                >

            </div>

            <select id="sort">

                <option value="default">
                    Sort By
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

                <option value="rating">
                    Top Rated
                </option>

            </select>

        </div>


        <!-- CATEGORIES -->

        <div class="categories">

            <button
                class="category active"
                data-category="all"
            >
                ✨ All
            </button>

            <button
                class="category"
                data-category="indian"
            >
                🍛 Indian
            </button>

            <button
                class="category"
                data-category="pizza"
            >
                🍕 Pizza
            </button>

            <button
                class="category"
                data-category="burger"
            >
                🍔 Burgers
            </button>

            <button
                class="category"
                data-category="starter"
            >
                🥗 Starters
            </button>

            <button
                class="category"
                data-category="dessert"
            >
                🍰 Desserts
            </button>

            <button
                class="category"
                data-category="drink"
            >
                🥤 Drinks
            </button>

        </div>


        <!-- FOOD -->

        <div
            class="food-grid"
            id="foodGrid"
        ></div>

    </section>


    <!-- CART OVERLAY -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeCart()"
    ></div>


    <!-- CART -->

    <aside
        class="cart"
        id="cart"
    >

        <div class="cart-header">

            <div>
                <small>
                    YOUR ORDER
                </small>

                <h2>
                    My Cart
                </h2>
            </div>

            <button onclick="closeCart()">
                ✕
            </button>

        </div>


        <div
            class="cart-items"
            id="cartItems"
        ></div>


        <div class="cart-footer">

            <div class="bill">
                <span>Subtotal</span>
                <strong id="subtotal">
                    ₹0
                </strong>
            </div>

            <div class="bill total">
                <span>Total</span>
                <strong id="total">
                    ₹0
                </strong>
            </div>

            <button
                class="checkout"
                onclick="checkout()"
            >
                Place Order →
            </button>

        </div>

    </aside>


    <!-- TOAST -->

    <div
        class="toast"
        id="toast"
    >
        Added to cart 🛒
    </div>


    <script>

        /* FOOD DATA */

        const foods = [

            {
                id: 1,
                name: "Butter Chicken",
                category: "indian",
                price: 349,
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?auto=format&fit=crop&w=800&q=80",
                description: "Creamy tomato gravy with tender chicken.",
                badge: "BESTSELLER"
            },

            {
                id: 2,
                name: "Paneer Tikka",
                category: "indian",
                price: 299,
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8?auto=format&fit=crop&w=800&q=80",
                description: "Smoky grilled paneer with Indian spices.",
                badge: "POPULAR"
            },

            {
                id: 3,
                name: "Royal Biryani",
                category: "indian",
                price: 399,
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1563379091339-03246963d96c?auto=format&fit=crop&w=800&q=80",
                description: "Aromatic basmati rice with royal spices.",
                badge: "CHEF'S PICK"
            },

            {
                id: 4,
                name: "Margherita Pizza",
                category: "pizza",
                price: 299,
                rating: 4.7,
                image: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=800&q=80",
                description: "Fresh tomato, mozzarella and basil.",
                badge: ""
            },

            {
                id: 5,
                name: "Cheese Burst Pizza",
                category: "pizza",
                price: 399,
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=800&q=80",
                description: "Loaded with gooey cheese and toppings.",
                badge: "MUST TRY"
            },

            {
                id: 6,
                name: "Classic Burger",
                category: "burger",
                price: 249,
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80",
                description: "Juicy patty, cheese and fresh vegetables.",
                badge: "POPULAR"
            },

            {
                id: 7,
                name: "Double Cheese Burger",
                category: "burger",
                price: 329,
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1553979459-d2229ba7433b?auto=format&fit=crop&w=800&q=80",
                description: "Double cheese with a crispy patty.",
                badge: "NEW"
            },

            {
                id: 8,
                name: "Crispy Spring Rolls",
                category: "starter",
                price: 189,
                rating: 4.6,
                image: "https://images.unsplash.com/photo-1548507200-4d7e2e7f5e6e?auto=format&fit=crop&w=800&q=80",
                description: "Crispy rolls filled with fresh vegetables.",
                badge: ""
            },

            {
                id: 9,
                name: "Chicken Wings",
                category: "starter",
                price: 299,
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=800&q=80",
                description: "Crispy wings tossed in spicy sauce.",
                badge: "HOT"
            },

            {
                id: 10,
                name: "Chocolate Cake",
                category: "dessert",
                price: 199,
                rating: 4.9,
                image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=800&q=80",
                description: "Rich chocolate cake with creamy frosting.",
                badge: "SWEET"
            },

            {
                id: 11,
                name: "Gulab Jamun",
                category: "dessert",
                price: 129,
                rating: 4.8,
                image: "https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80",
                description: "Warm gulab jamun with sugar syrup.",
                badge: ""
            },

            {
                id: 12,
                name: "Mango Shake",
                category: "drink",
                price: 149,
                rating: 4.7,
                image: "https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?auto=format&fit=crop&w=800&q=80",
                description: "Fresh mango blended with chilled milk.",
                badge: "FRESH"
            }

        ];


        let category = "all";

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];


        /* RENDER */

        function render() {

            let search =
                document
                .getElementById("search")
                .value
                .toLowerCase();


            let result =
                foods.filter(food => {

                    let categoryMatch =
                        category === "all" ||
                        food.category === category;

                    let searchMatch =
                        food.name
                        .toLowerCase()
                        .includes(search);

                    return categoryMatch &&
                           searchMatch;

                });


            let sort =
                document.getElementById("sort").value;


            if (sort === "low") {

                result.sort(
                    (a,b) =>
                    a.price - b.price
                );

            }


            if (sort === "high") {

                result.sort(
                    (a,b) =>
                    b.price - a.price
                );

            }


            if (sort === "rating") {

                result.sort(
                    (a,b) =>
                    b.rating - a.rating
                );

            }


            document.getElementById(
                "foodGrid"
            ).innerHTML =
                result.map(food => `

                    <div class="card">

                        <div class="card-img">

                            <img
                                src="${food.image}"
                                alt="${food.name}"
                            >

                            ${
                                food.badge
                                ?
                                `<span class="badge">
                                    ${food.badge}
                                </span>`
                                :
                                ""
                            }

                            <button
                                class="heart"
                                onclick="this.classList.toggle('liked')"
                            >
                                ♡
                            </button>

                        </div>


                        <div class="card-content">

                            <div class="card-top">

                                <h3>
                                    ${food.name}
                                </h3>

                                <span class="rating">
                                    ⭐ ${food.rating}
                                </span>

                            </div>

                            <p class="description">
                                ${food.description}
                            </p>

                            <div class="card-bottom">

                                <strong class="price">
                                    ₹${food.price}
                                </strong>

                                <button
                                    class="add"
                                    onclick="addToCart(${food.id})"
                                >
                                    + Add
                                </button>

                            </div>

                        </div>

                    </div>

                `).join("");

        }


        /* CATEGORY */

        document
        .querySelectorAll(".category")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    document
                    .querySelectorAll(".category")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                    button.classList.add("active");

                    category =
                        button.dataset.category;

                    render();

                }
            );

        });


        /* SEARCH */

        document
        .getElementById("search")
        .addEventListener(
            "input",
            render
        );


        /* SORT */

        document
        .getElementById("sort")
        .addEventListener(
            "change",
            render
        );


        /* ADD TO CART */

        function addToCart(id) {

            const food =
                foods.find(
                    item => item.id === id
                );


            const existing =
                cart.find(
                    item => item.id === id
                );


            if (existing) {

                existing.quantity++;

            } else {

                cart.push({
                    ...food,
                    quantity: 1
                });

            }


            saveCart();

            updateCart();

            showToast(
                food.name + " added 🛒"
            );

        }


        /* CART */

        function updateCart() {

            const container =
                document.getElementById(
                    "cartItems"
                );


            let count =
                cart.reduce(
                    (sum,item) =>
                    sum + item.quantity,
                    0
                );


            document.getElementById(
                "cartCount"
            ).textContent = count;


            if (cart.length === 0) {

                container.innerHTML = `

                    <div style="
                        text-align:center;
                        padding:60px 10px;
                        color:#777;
                    ">

                        <div style="
                            font-size:55px;
                        ">
                            🛒
                        </div>

                        <h3>
                            Cart is empty
                        </h3>

                        <p>
                            Add some delicious food!
                        </p>

                    </div>

                `;

            } else {

                container.innerHTML =
                    cart.map(item => `

                        <div class="cart-item">

                            <img
                                src="${item.image}"
                            >

                            <div class="cart-info">

                                <h4>
                                    ${item.name}
                                </h4>

                                <div class="cart-price">
                                    ₹${item.price}
                                </div>

                                <div class="quantity">

                                    <button
                                        onclick="changeQty(${item.id}, -1)"
                                    >
                                        −
                                    </button>

                                    <strong>
                                        ${item.quantity}
                                    </strong>

                                    <button
                                        onclick="changeQty(${item.id}, 1)"
                                    >
                                        +
                                    </button>

                                </div>

                            </div>

                            <button
                                class="remove"
                                onclick="removeItem(${item.id})"
                            >
                                ✕
                            </button>

                        </div>

                    `).join("");

            }


            updateTotal();

        }


        function changeQty(id, amount) {

            const item =
                cart.find(
                    item => item.id === id
                );


            if (!item) return;


            item.quantity += amount;


            if (item.quantity <= 0) {

                removeItem(id);

                return;

            }


            saveCart();

            updateCart();

        }


        function removeItem(id) {

            cart =
                cart.filter(
                    item => item.id !== id
                );


            saveCart();

            updateCart();

        }


        function updateTotal() {

            const total =
                cart.reduce(
                    (sum,item) =>
                    sum +
                    item.price *
                    item.quantity,
                    0
                );


            document.getElementById(
                "subtotal"
            ).textContent =
                "₹" + total;


            document.getElementById(
                "total"
            ).textContent =
                "₹" + total;

        }


        function saveCart() {

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

        }


        /* OPEN CART */

        function openCart() {

            document
            .getElementById("cart")
            .classList.add("open");

            document
            .getElementById("overlay")
            .classList.add("show");

        }


        /* CLOSE CART */

        function closeCart() {

            document
            .getElementById("cart")
            .classList.remove("open");

            document
            .getElementById("overlay")
            .classList.remove("show");

        }


        /* CHECKOUT */

        function checkout() {

            if (cart.length === 0) {

                showToast(
                    "Cart is empty 😅"
                );

                return;

            }


            alert(
                "🎉 Order placed successfully!"
            );


            cart = [];

            saveCart();

            updateCart();

            closeCart();

        }


        /* TOAST */

        function showToast(message) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;

            toast.classList.add("show");


            setTimeout(() => {

                toast.classList.remove(
                    "show"
                );

            }, 2000);

        }


        /* START */

        render();

        updateCart();

    </script>

</body>
</html>
